# Default vcluster Helm values template
# Developers can override these in their request files

# Syncer configuration - what gets synced from vcluster to host
syncer:
  extraArgs:
    - --tls-san=vcluster.local

# Resource limits for the vcluster control plane
resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

# Storage configuration
storage:
  className: local-path
  size: 5Gi

# Isolation settings
isolation:
  enabled: true
  podSecurityStandard: baseline

# Networking
service:
  type: ClusterIP

# Enable CoreDNS for name resolution
coredns:
  enabled: true
