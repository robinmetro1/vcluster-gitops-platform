apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: vcluster-generator
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  
  generators:
  - git:
      repoURL: https://github.com/robinmetro1/vcluster-gitops-platform.git
      revision: HEAD
      files:
      - path: "vclusters/team-*.yaml"
  
  template:
    metadata:
      name: 'vcluster-{{ .path.filename | replace ".yaml" "" }}'
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://charts.loft.sh
        chart: vcluster
        targetRevision: 0.31.0
        helm:
          releaseName: '{{ .path.filename | replace ".yaml" "" }}'
          values: |
            # vcluster control plane configuration
            controlPlane:
              distro:
                k3s:
                  enabled: true
            
            # Sync configuration
            sync:
              toHost:
                pods:
                  enabled: true
            
            # Resource quotas for the vcluster
            policies:
              resourceQuota:
                enabled: true
                quota:
                  requests.cpu: "2"
                  requests.memory: "4Gi"
                  limits.cpu: "4"
                  limits.memory: "8Gi"
                  persistentvolumeclaims: "10"
                  services.loadbalancers: "1"
      
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .path.filename | replace ".yaml" "" }}'
      
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true