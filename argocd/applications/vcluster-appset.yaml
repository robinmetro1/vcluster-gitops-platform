apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: vcluster-generator
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  
  generators:
  - git:
      repoURL: https://github.com/robinmetro1/vcluster-gitops-platform.git
      revision: HEAD
      files:
      - path: "vclusters/*.yaml"
  
  template:
    metadata:
      name: 'vcluster-{{ .path.filename | replace ".yaml" "" }}'
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://charts.loft.sh
        chart: vcluster
        targetRevision: 0.31.0
        helm:
          releaseName: '{{ .path.filename | replace ".yaml" "" }}'
          values: |
            controlPlane:
              distro:
                k3s:
                  enabled: true
            sync:
              toHost:
                pods:
                  enabled: true
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .path.filename | replace ".yaml" "" }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true