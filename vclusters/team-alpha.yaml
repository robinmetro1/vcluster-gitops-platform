apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vcluster-team-alpha
  namespace: argocd
spec:
  project: default
  
  source:
    repoURL: https://charts.loft.sh
    chart: vcluster
    targetRevision: 0.31.0
    helm:
      releaseName: team-alpha
      values: |
        # Minimal valid values for vcluster 0.31.x
        controlPlane:
          distro:
            k3s:
              enabled: true
        
        sync:
          toHost:
            pods:
              enabled: true
  
  destination:
    server: https://kubernetes.default.svc
    namespace: team-alpha
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
